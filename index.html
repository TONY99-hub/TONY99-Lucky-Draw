<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030303;color:#fff;font-family:Arial,sans-serif}body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 10%,#45300d,#050505 65%)}

.confetti{position:absolute;z-index:12;width:8px;height:14px;top:-20px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translate(var(--x),1050px) rotate(800deg);opacity:.15}}@media(max-width:420px){.stage{min-height:100vh}.identity,.history{border-width:1px}}
</style></head><body><main class="stage">
<section class="identity"><div class="field"><span class="label">TELEGRAM USERNAME</span><span class="value" id="username">@ja***99</span></div><div class="field"><span class="label">PHONE NUMBER</span><span class="value" id="phone">012****789</span></div></section>

<section class="result" id="result"><h2 id="resultTitle"></h2><p>Your result has been recorded. Return to Telegram Bot to continue.</p><a class="return" href="https://t.me/TONY99LuckyDrawBot">✅ RETURN TO BOT</a></section>
</main><script>
const prizes=[1,2,3,5,8,10],spin=document.getElementById('spin'),wheelbox=document.getElementById('wheelbox'),result=document.getElementById('result'),resultTitle=document.getElementById('resultTitle'),recordPoints=document.getElementById('recordPoints'),recordTime=document.getElementById('recordTime'),tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const params=new URLSearchParams(location.search),tgUser=tg?.initDataUnsafe?.user;function maskName(v){v=String(v||'TelegramUser').replace(/^@/,'');if(v.length<4)return '@'+v.slice(0,1)+'***';return '@'+v.slice(0,2)+'***'+v.slice(-2)}document.getElementById('username').textContent=maskName(params.get('username')||tgUser?.username||tgUser?.first_name);document.getElementById('phone').textContent=params.get('phone')||'Verified by Bot';
let running=false;
function confetti(){for(let i=0;i<45;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=['#ffd45c','#fff0a2','#b57d0b'][i%3];e.style.setProperty('--x',(Math.random()*150-75)+'px');e.style.animationDelay=Math.random()*.6+'s';document.querySelector('.stage').appendChild(e);setTimeout(()=>e.remove(),3200)}}function show(p,t){recordPoints.textContent=p+' Points';recordTime.textContent=t;resultTitle.textContent='YOU WON '+p+' POINTS!';result.style.display='block';spin.style.display='none'}
function finish(p){const t=new Date().toLocaleString('en-MY',{dateStyle:'short',timeStyle:'short'}),saved={version:2,points:p,time:t};localStorage.setItem('tony99_draw_done',JSON.stringify(saved));wheelbox.classList.remove('spinning');wheelbox.classList.add('done');show(p,t);confetti();if(tg){try{tg.sendData(JSON.stringify({type:'lucky_draw_result',points:p}))}catch(e){}}}spin.onclick=()=>{if(running||localStorage.getItem('tony99_draw_done'))return;running=true;spin.disabled=true;wheelbox.classList.add('spinning');const win=Math.floor(Math.random()*6);setTimeout(()=>{running=false;finish(prizes[win])},4800)};
const old=localStorage.getItem('tony99_draw_done');if(old){try{const v=JSON.parse(old);if(!v||typeof v!=='object'||v.version!==2||!prizes.includes(Number(v.points)))throw Error();show(Number(v.points),v.time||'Recorded')}catch(e){localStorage.removeItem('tony99_draw_done')}}
</script></body></html>
