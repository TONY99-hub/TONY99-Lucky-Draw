<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TONY99 Lucky Draw</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--gold:#ffd34e;--gold2:#ff9e20;--purple:#6f2ad4;--ink:#0b0614}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#562075 0,#1c0b31 38%,#08040f 85%);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;opacity:.18;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:27px 27px}
    .wrap{position:relative;z-index:1;width:min(100%,520px);margin:auto;padding:24px 18px 34px;text-align:center}
    .logo{width:min(74%,330px);height:auto;filter:drop-shadow(0 5px 16px #ffbd28aa);margin:2px auto 8px}
    .tag{margin:0 0 18px;color:#ffe59a;font-weight:700;letter-spacing:1px}
    .card{padding:22px 16px 20px;border:1px solid #ffffff24;border-radius:28px;background:#ffffff0d;box-shadow:0 20px 60px #0009;backdrop-filter:blur(8px)}
    .wheelbox{position:relative;width:min(82vw,370px);aspect-ratio:1;margin:12px auto 22px}
    .pointer{position:absolute;z-index:3;left:50%;top:-9px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid var(--gold);filter:drop-shadow(0 3px 4px #000)}
    canvas{width:100%;height:100%;display:block;border-radius:50%;border:9px solid #f7c33b;box-shadow:0 0 0 5px #8b4a06,0 0 30px #f4ae3270}
    .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#fff0a0,#ffab18);border:7px solid #fff2b0;color:#4a1900;font-weight:900;box-shadow:0 5px 16px #0008}
    button,a.action{width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:900;font-size:17px;text-decoration:none;display:block;cursor:pointer}
    #spin{color:#341000;background:linear-gradient(135deg,#fff18a,#ffab1d);box-shadow:0 8px 25px #f3ab3154}
    #spin:disabled{opacity:.55;cursor:not-allowed}
    .result{display:none;margin-top:18px;padding:18px;border-radius:18px;background:#ffffff12;border:1px solid #ffd34e66}
    .result h2{margin:0 0 8px;color:var(--gold);font-size:27px}.result p{margin:0 0 15px;color:#eee;line-height:1.45}
    #returnBot{color:#fff;background:linear-gradient(135deg,#7a36e8,#b03dc5)}
    .note{font-size:12px;color:#bdb0cb;margin:15px 4px 0;line-height:1.4}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="tony99-logo.png" alt="TONY99">
    <p class="tag">LUCKY DRAW • SPIN & WIN</p>
    <section class="card">
      <div class="wheelbox">
        <div class="pointer"></div>
        <canvas id="wheel" width="740" height="740"></canvas>
        <div class="hub">TONY99</div>
      </div>
      <button id="spin">🎁 SPIN NOW</button>
      <div class="result" id="result">
        <h2 id="resultTitle"></h2>
        <p>Tekan butang di bawah untuk kembali ke Telegram Bot.</p>
        <a class="action" id="returnBot" href="https://t.me/TONY99LuckyDrawBot">✅ RETURN TO BOT</a>
      </div>
      <p class="note">Satu Telegram ID dan satu nombor telefon hanya dibenarkan bermain sekali.</p>
    </section>
  </main>
  <script>
    const prizes=[1,2,3,5,8,10], colors=['#6929c4','#ed3c73','#ee8e2c','#3d55c7','#b82eaa','#d7a41d'];
    const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spin=document.getElementById('spin');
    const result=document.getElementById('result'),resultTitle=document.getElementById('resultTitle');
    const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
    let rotation=0,spinning=false,won=null;
    function draw(){const r=canvas.width/2,slice=Math.PI*2/prizes.length;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(r,r);ctx.rotate(rotation);for(let i=0;i<prizes.length;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-10,i*slice,(i+1)*slice);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#ffffff55';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.rotate((i+.5)*slice);ctx.translate(r*.60,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#fff';ctx.font='900 43px Arial';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillText(prizes[i]+' PT',0,13);ctx.restore()}ctx.restore()}
    draw();
    spin.addEventListener('click',()=>{if(spinning||localStorage.getItem('tony99_draw_done'))return;spinning=true;spin.disabled=true;won=Math.floor(Math.random()*prizes.length);const slice=Math.PI*2/prizes.length,target=-(won+.5)*slice-Math.PI/2,from=rotation,to=target+Math.PI*2*(7+Math.floor(Math.random()*3));const start=performance.now(),duration=4500;function animate(now){const p=Math.min((now-start)/duration,1),ease=1-Math.pow(1-p,4);rotation=from+(to-from)*ease;draw();if(p<1)requestAnimationFrame(animate);else{spinning=false;const points=prizes[won];localStorage.setItem('tony99_draw_done',String(points));resultTitle.textContent='🎉 Anda Menang '+points+' Points!';result.style.display='block';spin.style.display='none';if(tg){try{tg.sendData(JSON.stringify({type:'lucky_draw_result',points}));}catch(e){}}}}requestAnimationFrame(animate)});
    const previous=localStorage.getItem('tony99_draw_done');if(previous){spin.style.display='none';resultTitle.textContent='🎉 Anda Menang '+previous+' Points!';result.style.display='block'}
  </script>
</body>
</html>
