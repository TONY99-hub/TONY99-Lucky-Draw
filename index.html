<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080603" />
    <title>TONY99 Lucky Draw</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --gold: #ffc83d;
        --ease: cubic-bezier(0.12, 0.72, 0.13, 1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #030201;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        overflow-x: hidden;
      }
      .stage {
        position: relative;
        width: min(100%, 560px);
        min-height: 100svh;
        padding: max(14px, env(safe-area-inset-top)) 18px
          max(22px, env(safe-area-inset-bottom));
        overflow: hidden;
        background:
          linear-gradient(#05030155, #050301b5),
          url("casino-background.png") center/cover fixed;
        isolation: isolate;
      }
      .stage:before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: -20%;
        background:
          radial-gradient(circle at 50% 28%, #ffbf2433, transparent 30%),
          linear-gradient(
            100deg,
            transparent 28%,
            #ffdc7442 48%,
            transparent 65%
          );
        animation: sweep 8s ease-in-out infinite alternate;
      }
      .stage:after {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 0;
        background: linear-gradient(90deg, #0008, transparent 23% 77%, #0008);
      }
      @keyframes sweep {
        to {
          transform: translateX(14%) rotate(4deg);
        }
      }
      .dust {
        position: absolute;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }
      .dust i {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #ffd66a;
        box-shadow: 0 0 10px #ffc02f;
        animation: float var(--d) linear infinite;
        opacity: 0;
      }
      @keyframes float {
        0% {
          transform: translateY(105svh);
          opacity: 0;
        }
        15%,
        75% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(-15svh) translateX(var(--x));
          opacity: 0;
        }
      }
      .brand {
        text-align: center;
        margin-bottom: 10px;
        animation: enter 0.7s both;
      }
      .logo {
        display: block;
        max-width: min(72%, 360px);
        max-height: 74px;
        object-fit: contain;
        margin: auto;
        filter: drop-shadow(0 0 14px #f4ad25aa);
        animation: glow 2.8s ease-in-out infinite;
      }
      .tag {
        color: #ffe17a;
        font-family: Georgia, serif;
        font-weight: 800;
        font-size: clamp(14px, 4vw, 19px);
        letter-spacing: 2px;
      }
      @keyframes glow {
        50% {
          filter: drop-shadow(0 0 28px #ffd45c);
        }
      }
      .panel {
        background: linear-gradient(145deg, #080705ed, #1a1307ed);
        border: 1px solid #c99737;
        border-radius: 17px;
        box-shadow:
          inset 0 0 14px #ffc95020,
          0 8px 28px #000a;
      }
      .identity {
        display: grid;
        grid-template-columns: 1fr 1fr;
        padding: 11px 7px;
        margin-bottom: 14px;
        animation: enter 0.8s 0.08s both;
      }
      .field {
        min-width: 0;
        padding: 0 12px;
      }
      .field + .field {
        border-left: 1px solid #d9ab4f66;
      }
      .label {
        display: block;
        color: #cfb77b;
        font-size: clamp(10px, 2.7vw, 12px);
        font-weight: 800;
        white-space: nowrap;
      }
      .value {
        display: block;
        margin-top: 5px;
        color: #fff0b5;
        font-size: clamp(16px, 4.4vw, 22px);
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .game {
        position: relative;
        animation: enter 0.9s 0.14s both;
      }
      .pointer {
        position: absolute;
        z-index: 8;
        left: 50%;
        top: -9px;
        width: 48px;
        height: 62px;
        transform: translateX(-50%);
        transform-origin: 50% 8px;
        filter: drop-shadow(0 5px 4px #000);
      }
      .pointer:before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #a86600, #fff2a0 45%, #e39c0a);
        clip-path: polygon(50% 100%, 0 18%, 24% 0, 76% 0, 100% 18%);
      }
      .game.spinning .pointer {
        animation: tick 0.12s ease-in-out infinite alternate;
      }
      @keyframes tick {
        to {
          transform: translateX(-50%) rotate(9deg);
        }
      }
      .frame {
        position: relative;
        width: min(92vw, 480px);
        aspect-ratio: 1;
        margin: auto;
        border-radius: 50%;
        padding: 15px;
        background: repeating-conic-gradient(#5c3700 0 3deg, #ffe576 3deg 6deg);
        box-shadow:
          0 0 0 5px #2b1802,
          0 0 0 8px #efb72e,
          0 16px 30px #000,
          0 0 28px #e9a91c77;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          box-shadow:
            0 0 0 5px #2b1802,
            0 0 0 8px #ffd35a,
            0 16px 30px #000,
            0 0 42px #ffc637aa;
        }
      }
      .wheel {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        background: conic-gradient(
          from -30deg,
          #17120a 0 60deg,
          #8a5c0b 60deg 120deg,
          #151515 120deg 180deg,
          #bd8420 180deg 240deg,
          #17130b 240deg 300deg,
          #9c6910 300deg
        );
        border: 4px solid #120b01;
        transition: transform 5.2s var(--ease);
        will-change: transform;
      }
      .wheel:after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          transparent 47%,
          #ffe67826 65%,
          #0006
        );
      }
      .prize {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 50%;
        width: 88px;
        text-align: center;
        color: #fff2bd;
        font-family: Georgia, serif;
        font-weight: 900;
        font-size: clamp(21px, 6vw, 31px);
        text-shadow:
          0 3px 3px #000,
          0 0 8px #ffd556;
        transform: translate(-50%, -50%) rotate(var(--a))
          translateY(clamp(-185px, -36vw, -118px)) rotate(var(--r));
      }
      .hub {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: 50%;
        width: 27%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #fff1a1,
          #d99411 55%,
          #3b2100
        );
        border: 4px solid #ffdc66;
        box-shadow:
          0 5px 12px #000,
          0 0 18px #ffc938;
        color: #160d01;
        font-family: Georgia, serif;
        font-size: clamp(15px, 4.5vw, 23px);
        font-weight: 900;
      }
      .bulbs {
        position: absolute;
        z-index: 6;
        inset: 3px;
        border-radius: 50%;
        animation: bulbs 1.2s steps(2) infinite;
        background: repeating-conic-gradient(
          transparent 0 26deg,
          #fff6bd 27deg 29deg,
          transparent 30deg
        );
        filter: drop-shadow(0 0 5px #ffd342);
      }
      @keyframes bulbs {
        50% {
          transform: rotate(15deg);
          filter: drop-shadow(0 0 11px #fff0a0);
        }
      }
      .spin {
        width: 92%;
        height: 58px;
        margin: 17px 4% 14px;
        border: 2px solid #fff0a0;
        border-radius: 17px;
        background: linear-gradient(#fff3ac, #ffc12f 48%, #d38b08);
        box-shadow:
          inset 0 2px 3px #fff,
          0 7px 0 #794700,
          0 0 24px #ffbd2e;
        color: #211100;
        font-family: Georgia, serif;
        font-size: clamp(24px, 7vw, 34px);
        font-weight: 900;
        cursor: pointer;
        animation: btn 1.8s ease-in-out infinite;
      }
      .spin:active {
        transform: translateY(5px);
      }
      .spin:disabled {
        animation: none;
        filter: saturate(0.65);
      }
      @keyframes btn {
        50% {
          transform: scale(1.018);
          box-shadow:
            inset 0 2px 3px #fff,
            0 7px 0 #794700,
            0 0 40px #ffd054;
        }
      }
      .history {
        padding: 13px 16px 15px;
        animation: enter 0.85s 0.22s both;
      }
      .history h3 {
        margin: 0 0 9px;
        text-align: center;
        color: #ffe28a;
        font-family: Georgia, serif;
        font-size: clamp(17px, 4.7vw, 22px);
      }
      .record {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 0;
        padding-top: 9px;
        border-top: 1px solid #ae812c55;
        color: #cdbd93;
        font-size: 14px;
      }
      .record strong {
        color: #ffdc65;
      }
      .result {
        display: none;
        position: fixed;
        z-index: 30;
        left: 50%;
        top: 50%;
        width: min(88vw, 440px);
        transform: translate(-50%, -50%) scale(0.7);
        padding: 28px 22px;
        text-align: center;
        border-radius: 24px;
        background: linear-gradient(145deg, #080603, #291b05);
        border: 3px solid #f1b72f;
        box-shadow:
          0 0 0 100vmax #000b,
          0 0 60px #ffc644aa;
      }
      .result.show {
        display: block;
        animation: pop 0.55s var(--ease) forwards;
      }
      .result h2 {
        margin: 0 0 10px;
        color: #ffe079;
        font-family: Georgia, serif;
        font-size: clamp(28px, 8vw, 42px);
      }
      .result p {
        color: #e9ddc4;
        line-height: 1.5;
      }
      .return {
        display: block;
        margin-top: 18px;
        padding: 15px;
        border-radius: 14px;
        background: linear-gradient(#fff0a0, #d99e20);
        color: #231400;
        text-decoration: none;
        font-weight: 900;
        font-size: 18px;
      }
      .confetti {
        position: fixed;
        z-index: 40;
        width: 8px;
        height: 14px;
        top: -20px;
        animation: fall 2.7s linear forwards;
      }
      @keyframes fall {
        to {
          transform: translate(var(--x), 110vh) rotate(800deg);
          opacity: 0.1;
        }
      }
      @keyframes pop {
        to {
          transform: translate(-50%, -50%) scale(1);
        }
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-width: 380px) {
        .stage {
          padding-left: 12px;
          padding-right: 12px;
        }
        .field {
          padding: 0 8px;
        }
        .frame {
          padding: 12px;
        }
        .spin {
          height: 52px;
        }
        .prize {
          font-size: 21px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="dust" id="dust"></div>
      <header class="brand">
        <img class="logo" src="tony99-logo.png" alt="TONY99" />
        <div class="tag">LUCKY DRAW • SPIN &amp; WIN</div>
      </header>
      <section class="identity panel">
        <div class="field">
          <span class="label">TELEGRAM USERNAME</span
          ><span class="value" id="username">@ja***99</span>
        </div>
        <div class="field">
          <span class="label">PHONE NUMBER</span
          ><span class="value" id="phone">012****789</span>
        </div>
      </section>
      <section class="game" id="game">
        <div class="pointer"></div>
        <div class="frame">
          <div class="bulbs"></div>
          <div class="wheel" id="wheel">
            <span class="prize" style="--a: 0deg; --r: 0deg">1 PT</span
            ><span class="prize" style="--a: 60deg; --r: -60deg">2 PT</span
            ><span class="prize" style="--a: 120deg; --r: -120deg">3 PT</span
            ><span class="prize" style="--a: 180deg; --r: -180deg">5 PT</span
            ><span class="prize" style="--a: 240deg; --r: -240deg">8 PT</span
            ><span class="prize" style="--a: 300deg; --r: -300deg">10 PT</span>
            <div class="hub">TONY99</div>
          </div>
        </div>
        <button class="spin" id="spin">SPIN NOW</button>
      </section>
      <section class="history panel">
        <h3>🏆 WINNING RECORD</h3>
        <p class="record">
          <strong id="recordPoints">No winning record yet.</strong
          ><span id="recordTime"></span>
        </p>
      </section>
      <section class="result" id="result">
        <h2 id="resultTitle"></h2>
        <p>
          Your points have been recorded. Return to the Telegram Bot to
          continue.
        </p>
        <a class="return" href="https://t.me/TONY99LuckyDrawBot"
          >✅ RETURN TO BOT</a
        >
      </section>
    </main>
    <script>
      const prizes = [1, 2, 3, 5, 8, 10],
        spin = document.querySelector("#spin"),
        wheel = document.querySelector("#wheel"),
        game = document.querySelector("#game"),
        result = document.querySelector("#result"),
        title = document.querySelector("#resultTitle"),
        rp = document.querySelector("#recordPoints"),
        rt = document.querySelector("#recordTime"),
        tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const q = new URLSearchParams(location.search),
        u = tg?.initDataUnsafe?.user;
      function maskName(v) {
        v = String(v || "TelegramUser").replace(/^@/, "");
        return (
          "@" +
          (v.length < 4
            ? v.slice(0, 1) + "***"
            : v.slice(0, 2) + "***" + v.slice(-2))
        );
      }
      function maskPhone(v) {
        v = String(v || "").replace(/\s/g, "");
        return !v
          ? "Verified by Bot"
          : v.length < 7
            ? v.slice(0, 2) + "***"
            : v.slice(0, 3) + "****" + v.slice(-3);
      }
      document.querySelector("#username").textContent = maskName(
        q.get("username") || u?.username || u?.first_name,
      );
      document.querySelector("#phone").textContent = maskPhone(q.get("phone"));
      for (let i = 0; i < 24; i++) {
        let e = document.createElement("i");
        e.style.left = Math.random() * 100 + "%";
        e.style.setProperty("--d", 6 + Math.random() * 9 + "s");
        e.style.setProperty("--x", Math.random() * 90 - 45 + "px");
        e.style.animationDelay = -Math.random() * 12 + "s";
        dust.appendChild(e);
      }
      let running = false,
        rotation = 0;
      function confetti() {
        for (let i = 0; i < 52; i++) {
          let e = document.createElement("i");
          e.className = "confetti";
          e.style.left = Math.random() * 100 + "%";
          e.style.background = ["#ffd45c", "#fff0a2", "#b57d0b", "#fff"][i % 4];
          e.style.setProperty("--x", Math.random() * 180 - 90 + "px");
          e.style.animationDelay = Math.random() * 0.5 + "s";
          document.body.appendChild(e);
          setTimeout(() => e.remove(), 3300);
        }
      }
      function show(p, t) {
        rp.textContent = p + " Points";
        rt.textContent = t;
        title.textContent = "YOU WON " + p + " POINTS!";
        result.classList.add("show");
        spin.hidden = true;
      }
      function finish(p) {
        let t = new Date().toLocaleString("en-MY", {
          dateStyle: "short",
          timeStyle: "short",
        });
        localStorage.setItem(
          "tony99_draw_done",
          JSON.stringify({ version: 3, points: p, time: t }),
        );
        game.classList.remove("spinning");
        show(p, t);
        confetti();
        try {
          tg?.sendData(
            JSON.stringify({ type: "lucky_draw_result", points: p }),
          );
        } catch (e) {}
      }
      spin.onclick = () => {
        if (running || localStorage.getItem("tony99_draw_done")) return;
        running = true;
        spin.disabled = true;
        game.classList.add("spinning");
        let win = Math.floor(Math.random() * 6);
        rotation += 2520 + (360 - win * 60);
        wheel.style.transform = "rotate(" + rotation + "deg)";
        setTimeout(() => {
          running = false;
          finish(prizes[win]);
        }, 5350);
      };
      let old = localStorage.getItem("tony99_draw_done");
      if (old)
        try {
          let v = JSON.parse(old);
          if (v.version !== 3 || !prizes.includes(+v.points)) throw 0;
          show(+v.points, v.time || "Recorded");
        } catch (e) {
          localStorage.removeItem("tony99_draw_done");
        }
    </script>
  </body>
</html>
