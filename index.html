<!doctype html>

<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TONY99 Lucky Draw</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--gold:#ffd86a;--panel:#15120c;--muted:#b9ac8d}*{box-sizing:border-box}html{background:#050505}body{margin:0;min-height:100vh;color:#fff;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 0,#46300f 0,#100d08 32%,#050505 78%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(#ffd76a 1px,transparent 1px);background-size:26px 26px}.wrap{position:relative;z-index:1;width:min(100%,460px);margin:auto;padding:14px 13px 32px}header{text-align:center}.casino-deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;opacity:.13}.casino-deco span{position:absolute;color:#ffd86a;font-size:54px;text-shadow:0 0 18px #ffc43b}.casino-deco span:nth-child(1){left:4%;top:13%;transform:rotate(-18deg)}.casino-deco span:nth-child(2){right:4%;top:24%;transform:rotate(18deg)}.casino-deco span:nth-child(3){left:7%;bottom:10%;transform:rotate(12deg)}.casino-deco span:nth-child(4){right:6%;bottom:8%;transform:rotate(-15deg)}

    button,a.action{display:block;width:100%;border:0;border-radius:13px;padding:14px 16px;font-weight:900;font-size:16px;text-decoration:none;cursor:pointer}#spin{color:#2c1900;background:linear-gradient(135deg,#fff0a1,#f1aa1f 60%,#ffe27c);box-shadow:0 7px 22px #e6a92838}#spin:disabled{opacity:.55}.result{display:none;margin-top:13px;padding:15px;border-radius:15px;background:linear-gradient(135deg,#31240e,#17120a);border:1px solid #ffd86a6b}.result h2{margin:0 0 7px;color:#ffdb6e;font-size:23px}.result p{margin:0 0 13px;color:#d8cfbb;font-size:13px}#returnBot{color:#271700;background:linear-gradient(135deg,#ffe98c,#d59b1c)}
    .history{margin-top:10px;padding:13px}.history h3{margin:0 0 9px;color:#f5cb67;font-size:14px}.empty,.record{margin:0;padding:11px;border-radius:11px;background:#ffffff07;color:#bdb39e;font-size:12px}.record{display:none;color:#f4ead3}.record strong{color:#ffdc70}.record span{float:right;color:#a99c83}.note{font-size:10px;color:#877c67;text-align:center;margin:10px 5px 0;line-height:1.35}.burst{position:fixed;z-index:9;width:9px;height:15px;top:-20px;pointer-events:none;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(780deg);opacity:.2}}@media(max-width:360px){.wrap{padding:9px}.logo{width:52%}.wheelbox{width:72vw}.game{padding:11px 9px}.player{gap:6px}.value{font-size:12px}}
  </style>
</head>
<body><div class="casino-deco"><span>♠</span><span>♦</span><span>♣</span><span>🎰</span></div><main class="wrap"><header><img class="logo" src="tony99-logo.png" alt="TONY99"><p class="tag">LUCKY DRAW • SPIN & WIN</p></header>
  <section class="panel player"><div class="field"><span class="label">Telegram Username</span><span class="value" id="username">@Te***er</span></div><div class="field"><span class="label">Phone Number</span><span class="value" id="phone">012****789</span></div></section>
  <section class="panel game"><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas><div class="hub">TONY99</div></div><button id="spin">🎁 SPIN NOW</button><div class="result" id="result"><h2 id="resultTitle"></h2><p>Your result has been recorded. Return to the Telegram Bot to continue.</p><a class="action" id="returnBot" href="https://t.me/TONY99LuckyDrawBot">✅ RETURN TO BOT</a></div></section>
  <section class="panel history"><h3>🏆 WINNING RECORD</h3><p class="empty" id="empty">No winning record yet.</p><p class="record" id="record"><strong id="recordPoints"></strong><span id="recordTime"></span></p></section><p class="note">Each Telegram ID and phone number can play only once.</p></main>
  <script>
    const prizes=[1,2,3,5,8,10],colors=['#171717','#ba8518','#28231a','#d1a12f','#111','#8f6413'],canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spin=document.getElementById('spin'),result=document.getElementById('result'),resultTitle=document.getElementById('resultTitle');
    const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const params=new URLSearchParams(location.search),tgUser=tg?.initDataUnsafe?.user;
    function maskName(v){v=String(v||'TelegramUser').replace(/^@/,'');if(v.length<=3)return '@'+v[0]+'***';return '@'+v.slice(0,2)+'***'+v.slice(-2)}
    document.getElementById('username').textContent=maskName(params.get('username')||tgUser?.username||tgUser?.first_name);
    document.getElementById('phone').textContent=params.get('phone')||'Verified by Bot';let rotation=0,spinning=false;
    function draw(){const r=canvas.width/2,slice=Math.PI*2/prizes.length;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(r,r);ctx.rotate(rotation);for(let i=0;i<prizes.length;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-10,i*slice,(i+1)*slice);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#e9bd4c';ctx.lineWidth=4;ctx.stroke();const angle=(i+.5)*slice,x=Math.cos(angle)*r*.62,y=Math.sin(angle)*r*.62;ctx.save();ctx.translate(x,y);ctx.rotate(-rotation);ctx.fillStyle='#fff1bd';ctx.font='900 36px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillText(prizes[i]+' PT',0,0);ctx.restore()}ctx.restore()}
    const empty=document.getElementById('empty'),record=document.getElementById('record'),recordPoints=document.getElementById('recordPoints'),recordTime=document.getElementById('recordTime');
    function showRecord(p,t){empty.style.display='none';record.style.display='block';recordPoints.textContent=p+' Points';recordTime.textContent=t}function celebrate(){for(let i=0;i<42;i++){const e=document.createElement('i');e.className='burst';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd45c','#fff1ae','#b68015'][i%3];e.style.setProperty('--x',(Math.random()*160-80)+'px');e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3100)}}
    function finish(p){const now=new Date().toLocaleString('en-MY',{dateStyle:'short',timeStyle:'short'});localStorage.setItem('tony99_draw_done',JSON.stringify({points:p,time:now}));resultTitle.textContent='🎉 You Won '+p+' Points!';result.style.display='block';spin.style.display='none';showRecord(p,now);celebrate();if(tg){try{tg.sendData(JSON.stringify({type:'lucky_draw_result',points:p}))}catch(e){}}}
    draw();spin.onclick=()=>{if(spinning||localStorage.getItem('tony99_draw_done'))return;spinning=true;spin.disabled=true;const won=Math.floor(Math.random()*prizes.length),slice=Math.PI*2/prizes.length,target=-(won+.5)*slice-Math.PI/2,from=rotation,to=target+Math.PI*2*(8+Math.floor(Math.random()*3)),start=performance.now(),duration=4800;function animate(now){const p=Math.min((now-start)/duration,1),ease=1-Math.pow(1-p,4);rotation=from+(to-from)*ease;draw();p<1?requestAnimationFrame(animate):(spinning=false,finish(prizes[won]))}requestAnimationFrame(animate)};
    const previous=localStorage.getItem('tony99_draw_done');if(previous){try{const r=JSON.parse(previous);spin.style.display='none';resultTitle.textContent='🎉 You Won '+r.points+' Points!';result.style.display='block';showRecord(r.points,r.time||'Recorded')}catch(e){localStorage.removeItem('tony99_draw_done')}}
  </script></body></html>
