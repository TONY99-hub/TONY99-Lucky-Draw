<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080603" />
    <title>TONY99 Lucky Draw</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --gold: #ffc83d;
        --ease: cubic-bezier(0.12, 0.72, 0.13, 1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #030201;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        overflow-x: hidden;
      }
      .stage {
        position: relative;
        width: min(100%, 560px);
        min-height: 100svh;
        padding: max(18px, env(safe-area-inset-top)) 24px
          max(28px, env(safe-area-inset-bottom));
        overflow: hidden;
        background:
          linear-gradient(#05030155, #050301b5),
          url("casino-background.png") center/cover fixed;
        isolation: isolate;
      }
      .stage:before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: -20%;
        background:
          radial-gradient(circle at 50% 28%, #ffbf2433, transparent 30%),
          linear-gradient(
            100deg,
            transparent 28%,
            #ffdc7442 48%,
            transparent 65%
          );
        animation: sweep 8s ease-in-out infinite alternate;
      }
      .stage:after {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 0;
        background: linear-gradient(90deg, #0008, transparent 23% 77%, #0008);
      }
      @keyframes sweep {
        to {
          transform: translateX(14%) rotate(4deg);
        }
      }
      .dust {
        position: absolute;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }
      .dust i {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #ffd66a;
        box-shadow: 0 0 10px #ffc02f;
        animation: float var(--d) linear infinite;
        opacity: 0;
      }
      @keyframes float {
        0% {
          transform: translateY(105svh);
          opacity: 0;
        }
        15%,
        75% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(-15svh) translateX(var(--x));
          opacity: 0;
        }
      }
      .brand {
        position: relative;
        text-align: center;
        margin-bottom: 18px;
        animation: enter 0.7s both;
      }
      .crown {
        position: relative;
        width: 45px;
        height: 25px;
        margin: 0 auto 3px;
        background: linear-gradient(100deg, #a86500, #fff2a0 46%, #d38c00);
        clip-path: polygon(0 100%, 0 35%, 24% 68%, 50% 0, 76% 68%, 100% 35%, 100% 100%);
        filter: drop-shadow(0 0 9px #ffc83d);
      }
      .crown:after {
        content: "";
        position: absolute;
        left: 1px;
        right: 1px;
        bottom: 0;
        height: 5px;
        background: #ffe377;
      }
      .brand:before,
      .brand:after {
        content: "";
        position: absolute;
        top: 35px;
        width: 25%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #ffdc61);
        box-shadow: 0 0 8px #ffc83d;
      }
      .brand:before { left: 6%; }
      .brand:after { right: 6%; transform: scaleX(-1); }
      .logo {
        display: block;
        max-width: min(78%, 390px);
        max-height: 82px;
        object-fit: contain;
        margin: auto;
        filter: drop-shadow(0 0 14px #f4ad25aa);
        animation: glow 2.8s ease-in-out infinite;
      }
      .tag {
        color: #ffe17a;
        font-family: Georgia, serif;
        font-weight: 800;
        font-size: clamp(15px, 4.2vw, 21px);
        letter-spacing: 2.4px;
        text-shadow: 0 2px 4px #000, 0 0 12px #b57600;
      }
      @keyframes glow {
        50% {
          filter: drop-shadow(0 0 28px #ffd45c);
        }
      }
      .panel {
        background: linear-gradient(145deg, #050403f5, #171006f5);
        border: 2px solid #daa937;
        border-radius: 20px;
        box-shadow:
          inset 0 0 0 3px #3b270b,
          inset 0 0 18px #ffc95022,
          0 8px 28px #000a;
      }
      .identity {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        padding: 14px 8px;
        margin-bottom: 22px;
        animation: enter 0.8s 0.08s both;
      }
      .field {
        min-width: 0;
        padding: 1px 15px;
        text-align: left;
      }
      .field + .field {
        border-left: 1px solid #d9ab4f66;
      }
      .label {
        display: block;
        color: #cfb77b;
        font-size: clamp(10px, 2.8vw, 13px);
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .value {
        display: block;
        margin-top: 5px;
        color: #fff0b5;
        font-size: clamp(17px, 4.7vw, 24px);
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .game {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: enter 0.9s 0.14s both;
      }
      .game:after {
        content: "";
        position: absolute;
        z-index: -1;
        top: min(calc(92vw - 16px), 454px);
        width: 72%;
        height: 68px;
        border-radius: 50% 50% 14px 14px / 55% 55% 28px 28px;
        background: linear-gradient(90deg, #2c1600, #e5a91d 12%, #3b2003 28%, #130b03 50%, #5d3505 70%, #f2bd36 88%, #2b1600);
        border: 3px solid #d99c20;
        box-shadow: inset 0 9px 12px #fff19b33, 0 14px 22px #000d;
      }
      .pointer {
        position: absolute;
        z-index: 8;
        left: 50%;
        top: -22px;
        width: 54px;
        height: 78px;
        transform: translateX(-50%);
        transform-origin: 50% 8px;
        filter: drop-shadow(0 5px 4px #000);
      }
      .pointer:before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #a86600, #fff2a0 45%, #e39c0a);
        clip-path: polygon(50% 100%, 7% 31%, 22% 11%, 78% 11%, 93% 31%);
      }
      .pointer:after {
        content: "";
        position: absolute;
        left: 50%;
        top: 2px;
        width: 27px;
        height: 27px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle, #fffbe3 0 33%, #ffd243 36% 55%, #8d5200 59% 100%);
        box-shadow: 0 0 12px #ffd449;
      }
      .game.spinning .pointer {
        animation: tick 0.12s ease-in-out infinite alternate;
      }
      @keyframes tick {
        to {
          transform: translateX(-50%) rotate(9deg);
        }
      }
      .frame {
        --ring: 24px;
        position: relative;
        width: min(calc(92vw - 20px), 454px);
        height: min(calc(92vw - 20px), 454px);
        min-width: 0;
        min-height: 0;
        flex: 0 0 auto;
        margin: auto;
        border-radius: 50%;
        padding: var(--ring);
        overflow: hidden;
        background:
          radial-gradient(circle at 42% 34%, #68420b 0 2%, transparent 24%),
          linear-gradient(135deg, #1d1104, #f1bd3a 12%, #2b1703 26%, #0a0704 50%, #9d690c 74%, #ffd862 88%, #261500);
        box-shadow:
          inset 0 0 0 3px #fff1a2,
          inset 0 0 0 8px #281600,
          inset 0 0 0 12px #dca323,
          0 0 0 3px #2b1802,
          0 0 0 7px #efb72e,
          0 16px 30px #000,
          0 0 28px #e9a91c77;
        animation: pulse 2.8s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          box-shadow:
            inset 0 0 0 3px #fff1a2,
            inset 0 0 0 8px #281600,
            inset 0 0 0 12px #f0b72f,
            0 0 0 3px #2b1802,
            0 0 0 7px #ffd35a,
            0 16px 30px #000,
            0 0 42px #ffc637aa;
        }
      }
      .bulb {
        position: absolute;
        z-index: 6;
        left: 50%;
        top: 50%;
        width: 13px;
        height: 13px;
        margin: -6.5px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 28%, #fff, #ffe271 32%, #d38c04 74%);
        border: 1px solid #5a3600;
        box-shadow: 0 0 9px #ffc83d;
        transform: rotate(var(--a)) translateY(calc((min(calc(92vw - 20px), 454px) / -2) + 12px));
        pointer-events: none;
      }
      .wheel {
        position: absolute;
        inset: var(--ring);
        width: auto;
        height: auto;
        border-radius: 50%;
        overflow: hidden;
        background: conic-gradient(
          from -30deg,
          #151108 0 60deg,
          #8d600e 60deg 120deg,
          #11100d 120deg 180deg,
          #bc8421 180deg 240deg,
          #17130b 240deg 300deg,
          #86590d 300deg
        );
        border: 4px solid #eab12d;
        transition: transform 5.2s var(--ease);
        will-change: transform;
      }
      .wheel:after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          transparent 38%,
          #ffe67815 63%,
          #0008
        );
      }
      .wheel:before {
        content: "";
        position: absolute;
        z-index: 1;
        inset: 0;
        border-radius: 50%;
        background: repeating-conic-gradient(from -30deg, transparent 0 59.2deg, #f3c64b 59.2deg 60deg);
        box-shadow: inset 0 0 42px #000b;
        pointer-events: none;
      }
      .prize {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 50%;
        width: 64px;
        text-align: center;
        color: #fff2bd;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-size: clamp(21px, 6vw, 31px);
        text-shadow:
          0 3px 3px #000,
          0 0 8px #ffd556;
        transform: translate(-50%, -50%) rotate(var(--a))
          translateY(clamp(-142px, -27.2vw, -88px)) rotate(var(--r));
      }
      .hub {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: 50%;
        width: 31%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 32%, #30220b, #090704 55%, #000);
        border: 6px double #ffdc66;
        box-shadow:
          0 5px 12px #000,
          0 0 18px #ffc938;
        padding: 13px;
      }
      .hub img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 54%;
        object-fit: contain;
        filter: drop-shadow(0 0 7px #d49411);
      }
      .spin {
        position: relative;
        z-index: 2;
        width: 88%;
        height: 70px;
        margin: 32px 6% 19px;
        border: 3px solid #fff0a0;
        border-radius: 24px;
        background: linear-gradient(#fff8ce 0%, #ffd959 27%, #f5a900 72%, #c87e00 100%);
        box-shadow:
          inset 0 2px 3px #fff,
          0 7px 0 #794700,
          0 0 24px #ffbd2e;
        color: #211100;
        font-family: Georgia, serif;
        font-size: clamp(28px, 7.6vw, 39px);
        font-weight: 900;
        cursor: pointer;
        animation: btn 1.8s ease-in-out infinite;
      }
      .spin:active {
        transform: translateY(5px);
      }
      .spin:disabled {
        animation: none;
        filter: saturate(0.65);
      }
      @keyframes btn {
        50% {
          transform: scale(1.018);
          box-shadow:
            inset 0 2px 3px #fff,
            0 7px 0 #794700,
            0 0 40px #ffd054;
        }
      }
      .history {
        padding: 19px 22px 21px;
        animation: enter 0.85s 0.22s both;
      }
      .history h3 {
        margin: 0 0 9px;
        text-align: center;
        color: #ffe28a;
        font-family: Georgia, serif;
        font-size: clamp(19px, 5.2vw, 27px);
      }
      .record {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 0;
        padding-top: 9px;
        border-top: 1px solid #ae812c55;
        color: #cdbd93;
        font-size: 16px;
      }
      .record strong {
        color: #ffdc65;
      }
      .result {
        display: none;
        position: fixed;
        z-index: 30;
        left: 50%;
        top: 50%;
        width: min(88vw, 440px);
        transform: translate(-50%, -50%) scale(0.7);
        padding: 28px 22px;
        text-align: center;
        border-radius: 24px;
        background: linear-gradient(145deg, #080603, #291b05);
        border: 3px solid #f1b72f;
        box-shadow:
          0 0 0 100vmax #000b,
          0 0 60px #ffc644aa;
      }
      .result.show {
        display: block;
        animation: pop 0.55s var(--ease) forwards;
      }
      .result h2 {
        margin: 0 0 10px;
        color: #ffe079;
        font-family: Georgia, serif;
        font-size: clamp(28px, 8vw, 42px);
      }
      .result p {
        color: #e9ddc4;
        line-height: 1.5;
      }
      .return {
        display: block;
        margin-top: 18px;
        padding: 15px;
        border-radius: 14px;
        background: linear-gradient(#fff0a0, #d99e20);
        color: #231400;
        text-decoration: none;
        font-weight: 900;
        font-size: 18px;
      }
      .confetti {
        position: fixed;
        z-index: 40;
        width: 8px;
        height: 14px;
        top: -20px;
        animation: fall 2.7s linear forwards;
      }
      @keyframes fall {
        to {
          transform: translate(var(--x), 110vh) rotate(800deg);
          opacity: 0.1;
        }
      }
      @keyframes pop {
        to {
          transform: translate(-50%, -50%) scale(1);
        }
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-width: 380px) {
        .stage {
          padding-left: 16px;
          padding-right: 16px;
        }
        .field {
          padding: 0 10px;
        }
        .frame {
          --ring: 19px;
          width: calc(92vw - 20px);
          height: calc(92vw - 20px);
        }
        .spin {
          height: 62px;
        }
        .prize {
          font-size: 21px;
        }
      }
      @media (max-width: 600px) {
        .stage {
          padding-top: max(8px, env(safe-area-inset-top));
          padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        .brand {
          margin-bottom: 10px;
        }
        .crown {
          width: 35px;
          height: 19px;
          margin-bottom: 0;
        }
        .brand:before,
        .brand:after {
          top: 26px;
        }
        .logo {
          max-height: 58px;
        }
        .tag {
          font-size: clamp(13px, 3.9vw, 17px);
          line-height: 1.05;
        }
        .identity {
          min-height: 60px;
          padding-top: 9px;
          padding-bottom: 9px;
          margin-bottom: 16px;
        }
        .label {
          font-size: clamp(9px, 2.6vw, 11px);
        }
        .value {
          font-size: clamp(15px, 4.2vw, 20px);
        }
        .frame {
          --ring: 20px;
          width: min(calc(82vw - 20px), 365px);
          height: min(calc(82vw - 20px), 365px);
        }
        .bulb {
          transform: rotate(var(--a)) translateY(calc((min(calc(82vw - 20px), 365px) / -2) + 11px));
        }
        .game:after {
          top: min(calc(82vw - 7px), 378px);
          height: 52px;
        }
        .pointer {
          width: 46px;
          height: 66px;
          top: -19px;
        }
        .pointer:after {
          width: 23px;
          height: 23px;
        }
        .prize {
          font-size: clamp(19px, 5.7vw, 26px);
          transform: translate(-50%, -50%) rotate(var(--a))
            translateY(clamp(-112px, -23.5vw, -77px)) rotate(var(--r));
        }
        .spin {
          height: 56px;
          margin-top: 27px;
          margin-bottom: 12px;
          font-size: clamp(25px, 7vw, 32px);
          border-radius: 19px;
        }
        .history {
          padding: 13px 18px 15px;
        }
        .history h3 {
          margin-bottom: 7px;
          font-size: clamp(18px, 5vw, 23px);
        }
        .record {
          padding-top: 7px;
          font-size: 14px;
        }
      }
      @media (max-height: 720px) and (max-width: 600px) {
        .frame {
          width: min(68vw, 310px);
          height: min(68vw, 310px);
        }
        .bulb {
          transform: rotate(var(--a)) translateY(calc((min(68vw, 310px) / -2) + 10px));
        }
        .game:after {
          top: min(calc(68vw + 13px), 323px);
        }
        .prize {
          transform: translate(-50%, -50%) rotate(var(--a))
            translateY(clamp(-93px, -19vw, -66px)) rotate(var(--r));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="dust" id="dust"></div>
      <header class="brand">
        <div class="crown" aria-hidden="true"></div>
        <img class="logo" src="tony99-logo.png" alt="TONY99" />
        <div class="tag">LUCKY DRAW • SPIN &amp; WIN</div>
      </header>
      <section class="identity panel">
        <div class="field">
          <span class="label">TELEGRAM USERNAME</span
          ><span class="value" id="username">@ja***99</span>
        </div>
        <div class="field">
          <span class="label">PHONE NUMBER</span
          ><span class="value" id="phone">012****789</span>
        </div>
      </section>
      <section class="game" id="game">
        <div class="pointer"></div>
        <div class="frame">
          <i class="bulb" style="--a: 0deg"></i><i class="bulb" style="--a: 30deg"></i>
          <i class="bulb" style="--a: 60deg"></i><i class="bulb" style="--a: 90deg"></i>
          <i class="bulb" style="--a: 120deg"></i><i class="bulb" style="--a: 150deg"></i>
          <i class="bulb" style="--a: 180deg"></i><i class="bulb" style="--a: 210deg"></i>
          <i class="bulb" style="--a: 240deg"></i><i class="bulb" style="--a: 270deg"></i>
          <i class="bulb" style="--a: 300deg"></i><i class="bulb" style="--a: 330deg"></i>
          <div class="wheel" id="wheel">
            <span class="prize" style="--a: 0deg; --r: 0deg">$1</span
            ><span class="prize" style="--a: 60deg; --r: -60deg">$2</span
            ><span class="prize" style="--a: 120deg; --r: -120deg">$3</span
            ><span class="prize" style="--a: 180deg; --r: -180deg">$5</span
            ><span class="prize" style="--a: 240deg; --r: -240deg">$8</span
            ><span class="prize" style="--a: 300deg; --r: -300deg">$10</span>
          </div>
          <div class="hub"><img src="tony99-logo.png" alt="TONY99" /></div>
        </div>
        <button class="spin" id="spin">SPIN NOW</button>
      </section>
      <section class="history panel">
        <h3>🏆 WINNING RECORD</h3>
        <p class="record">
          <strong id="recordPoints">No winning record yet.</strong
          ><span id="recordTime"></span>
        </p>
      </section>
      <section class="result" id="result">
        <h2 id="resultTitle"></h2>
        <p>
          Your prize has been recorded. Return to the Telegram Bot to
          continue.
        </p>
        <a class="return" id="returnToBot" href="tg://resolve?domain=TONY99LuckyDrawBot&amp;start=game_return"
          >✅ RETURN TO BOT</a
        >
      </section>
    </main>
    <script>
      const prizes = [1, 2, 3, 5, 8, 10],
        spin = document.querySelector("#spin"),
        wheel = document.querySelector("#wheel"),
        game = document.querySelector("#game"),
        result = document.querySelector("#result"),
        title = document.querySelector("#resultTitle"),
        rp = document.querySelector("#recordPoints"),
        rt = document.querySelector("#recordTime"),
        returnToBot = document.querySelector("#returnToBot"),
        tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      returnToBot.addEventListener("click", (event) => {
        if (!tg?.initData) return;
        event.preventDefault();
        try {
          tg.openTelegramLink(
            "https://t.me/TONY99LuckyDrawBot?start=game_return",
          );
        } catch (e) {
          location.href =
            "tg://resolve?domain=TONY99LuckyDrawBot&start=game_return";
        }
      });
      const q = new URLSearchParams(location.search),
        u = tg?.initDataUnsafe?.user;
      function maskName(v) {
        v = String(v || "TelegramUser").replace(/^@/, "");
        return (
          "@" +
          (v.length < 4
            ? v.slice(0, 1) + "***"
            : v.slice(0, 2) + "***" + v.slice(-2))
        );
      }
      function maskPhone(v) {
        v = String(v || "").replace(/\s/g, "");
        return !v
          ? "Verified by Bot"
          : v.length < 7
            ? v.slice(0, 2) + "***"
            : v.slice(0, 3) + "****" + v.slice(-3);
      }
      document.querySelector("#username").textContent = maskName(
        q.get("username") || u?.username || u?.first_name,
      );
      document.querySelector("#phone").textContent = maskPhone(q.get("phone"));
      for (let i = 0; i < 24; i++) {
        let e = document.createElement("i");
        e.style.left = Math.random() * 100 + "%";
        e.style.setProperty("--d", 6 + Math.random() * 9 + "s");
        e.style.setProperty("--x", Math.random() * 90 - 45 + "px");
        e.style.animationDelay = -Math.random() * 12 + "s";
        dust.appendChild(e);
      }
      let running = false,
        rotation = 0;
      function confetti() {
        for (let i = 0; i < 52; i++) {
          let e = document.createElement("i");
          e.className = "confetti";
          e.style.left = Math.random() * 100 + "%";
          e.style.background = ["#ffd45c", "#fff0a2", "#b57d0b", "#fff"][i % 4];
          e.style.setProperty("--x", Math.random() * 180 - 90 + "px");
          e.style.animationDelay = Math.random() * 0.5 + "s";
          document.body.appendChild(e);
          setTimeout(() => e.remove(), 3300);
        }
      }
      function show(p, t) {
        rp.textContent = "$" + p;
        rt.textContent = t;
        title.textContent = "YOU WON $" + p + "!";
        result.classList.add("show");
        spin.hidden = true;
      }
      function finish(p) {
        let t = new Date().toLocaleString("en-MY", {
          dateStyle: "short",
          timeStyle: "short",
        });
        localStorage.setItem(
          "tony99_draw_done",
          JSON.stringify({ version: 3, points: p, time: t }),
        );
        game.classList.remove("spinning");
        show(p, t);
        confetti();
        try {
          tg?.sendData(
            JSON.stringify({ type: "lucky_draw_result", points: p }),
          );
        } catch (e) {}
      }
      spin.onclick = () => {
        if (running || localStorage.getItem("tony99_draw_done")) return;
        running = true;
        spin.disabled = true;
        game.classList.add("spinning");
        let win = Math.floor(Math.random() * 6);
        rotation += 2520 + (360 - win * 60);
        wheel.style.transform = "rotate(" + rotation + "deg)";
        setTimeout(() => {
          running = false;
          finish(prizes[win]);
        }, 5350);
      };
      let old = localStorage.getItem("tony99_draw_done");
      if (old)
        try {
          let v = JSON.parse(old);
          if (v.version !== 3 || !prizes.includes(+v.points)) throw 0;
          show(+v.points, v.time || "Recorded");
        } catch (e) {
          localStorage.removeItem("tony99_draw_done");
        }
    </script>
  </body>
</html>
