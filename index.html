<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TONY99 Lucky Draw</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030303;color:#fff;font-family:Arial,sans-serif}body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 10%,#45300d,#050505 65%)}

</style></head><body><main class="stage">

</main><script>
const prizes=[1,2,3,5,8,10],colors=['#0d0d0d','#a87513','#161616','#c28d19','#0a0a0a','#9a6a10'];const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spin=document.getElementById('spin'),result=document.getElementById('result'),resultTitle=document.getElementById('resultTitle'),recordPoints=document.getElementById('recordPoints'),recordTime=document.getElementById('recordTime'),tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const params=new URLSearchParams(location.search),tgUser=tg?.initDataUnsafe?.user;function maskName(v){v=String(v||'TelegramUser').replace(/^@/,'');if(v.length<4)return '@'+v.slice(0,1)+'***';return '@'+v.slice(0,2)+'***'+v.slice(-2)}document.getElementById('username').textContent=maskName(params.get('username')||tgUser?.username||tgUser?.first_name);document.getElementById('phone').textContent=params.get('phone')||'Verified by Bot';
let rotation=0,running=false;function draw(){const r=360,s=Math.PI*2/prizes.length;ctx.clearRect(0,0,720,720);ctx.save();ctx.translate(r,r);ctx.rotate(rotation);for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-14,i*s,(i+1)*s);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#e1ae35';ctx.lineWidth=5;ctx.stroke();const a=(i+.5)*s,x=Math.cos(a)*r*.62,y=Math.sin(a)*r*.62;ctx.save();ctx.translate(x,y);ctx.rotate(-rotation);ctx.fillStyle='#ffe7a1';ctx.font='900 37px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.fillText(prizes[i]+' PT',0,0);ctx.restore()}for(let i=0;i<18;i++){const a=i*Math.PI*2/18;ctx.beginPath();ctx.arc(Math.cos(a)*r*.89,Math.sin(a)*r*.89,7,0,Math.PI*2);ctx.fillStyle='#ffe277';ctx.shadowColor='#ffc32e';ctx.shadowBlur=12;ctx.fill()}ctx.restore()}
function confetti(){for(let i=0;i<45;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=['#ffd45c','#fff0a2','#b57d0b'][i%3];e.style.setProperty('--x',(Math.random()*150-75)+'px');e.style.animationDelay=Math.random()*.6+'s';document.querySelector('.stage').appendChild(e);setTimeout(()=>e.remove(),3200)}}function show(p,t){recordPoints.textContent=p+' Points';recordTime.textContent=t;resultTitle.textContent='YOU WON '+p+' POINTS!';result.style.display='block';spin.style.display='none'}
function finish(p){const t=new Date().toLocaleString('en-MY',{dateStyle:'short',timeStyle:'short'}),saved={version:2,points:p,time:t};localStorage.setItem('tony99_draw_done',JSON.stringify(saved));show(p,t);confetti();if(tg){try{tg.sendData(JSON.stringify({type:'lucky_draw_result',points:p}))}catch(e){}}}draw();spin.onclick=()=>{if(running||localStorage.getItem('tony99_draw_done'))return;running=true;spin.disabled=true;const win=Math.floor(Math.random()*6),s=Math.PI*2/6,target=-(win+.5)*s-Math.PI/2,from=rotation,to=target+Math.PI*2*(8+Math.floor(Math.random()*3)),start=performance.now();function go(now){const p=Math.min((now-start)/4800,1),ease=1-Math.pow(1-p,4);rotation=from+(to-from)*ease;draw();if(p<1)requestAnimationFrame(go);else{running=false;finish(prizes[win])}}requestAnimationFrame(go)};
const old=localStorage.getItem('tony99_draw_done');if(old){try{const v=JSON.parse(old);if(!v||typeof v!=='object'||v.version!==2||!prizes.includes(Number(v.points)))throw Error();show(Number(v.points),v.time||'Recorded')}catch(e){localStorage.removeItem('tony99_draw_done')}}
</script></body></html>
